<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sprout Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, a soft card stack per screen, bottom tab bar. Palette grown from cocoa, sage and cream. */
:root{
  --paper:#FAF5EA; --card:#FFFCF5; --cream:#F1E7D3; --oat:#E6D8BD; --line:#E3D5BB;
  --ink:#5C3A26; --ink-2:#86624C; --ink-3:#A88B74;
  --sage:#A3B18A; --moss:#5F7048; --on-moss:#FFFCF5;
  --butter:#EBC96F; --blush:#E7B7A4; --lavender:#BBAAD2; --mist:#A9C6C6; --peach:#EFC9A5;
  --tile-ink:#4A2E1E;
  --good:#5F7F45; --good-bg:#E3EAD3; --warn:#9A6A16; --warn-bg:#F6E6BF; --high:#A4553A; --high-bg:#F4D9CC;
  --bean:#F6E7C8; --shadow:0 1px 0 rgba(92,58,38,.06),0 6px 18px -10px rgba(92,58,38,.25);
  --f-display:"Fredoka","Nunito","Varela Round",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#221812; --card:#2D2018; --cream:#38291E; --oat:#46342666; --line:#47362A;
  --ink:#F1E7D3; --ink-2:#CDB89F; --ink-3:#9C8670;
  --sage:#A3B18A; --moss:#B7C69C; --on-moss:#221812;
  --butter:#E3C064; --blush:#DDA693; --lavender:#AE9CC8; --mist:#9EBEBE; --peach:#E2B98F;
  --tile-ink:#3B2416;
  --good:#B5CD94; --good-bg:#34402A; --warn:#E8C27A; --warn-bg:#4A3A1C; --high:#E8A38A; --high-bg:#4C2C21;
  --bean:#E9D6AF; --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#221812; --card:#2D2018; --cream:#38291E; --oat:#46342666; --line:#47362A;
  --ink:#F1E7D3; --ink-2:#CDB89F; --ink-3:#9C8670;
  --sage:#A3B18A; --moss:#B7C69C; --on-moss:#221812;
  --butter:#E3C064; --blush:#DDA693; --lavender:#AE9CC8; --mist:#9EBEBE; --peach:#E2B98F;
  --tile-ink:#3B2416;
  --good:#B5CD94; --good-bg:#34402A; --warn:#E8C27A; --warn-bg:#4A3A1C; --high:#E8A38A; --high-bg:#4C2C21;
  --bean:#E9D6AF; --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:28px;line-height:1.1}
h2{font-size:19px}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:8px 2px -4px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--moss);outline-offset:2px;border-radius:10px}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:600;background:var(--moss);color:var(--on-moss);font-family:var(--f-display);font-size:16px;letter-spacing:.01em}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--cream);color:var(--ink)}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.danger{background:var(--high-bg);color:var(--high)}
.icon-btn{border:0;background:var(--cream);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--cream);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.high{background:var(--high-bg);color:var(--high)}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;background:linear-gradient(160deg,var(--cream),var(--card));border:1px solid var(--line);border-radius:28px;padding:18px 16px 0 18px;overflow:hidden}
.hero .bubble{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:14px;margin:10px 0 16px;max-width:30ch}
.sprout{width:128px;height:128px;display:block}
.sprout .sway{transform-origin:64px 58px;animation:sway 4.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.ringrow{display:flex;align-items:center;gap:14px}
.ring{width:56px;height:56px;flex:none}

/* habits */
.habits{display:flex;flex-direction:column;gap:10px}
.habit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 12px 10px 10px;box-shadow:var(--shadow);transition:transform .15s ease,background .2s}
.habit:active{transform:scale(.985)}
.habit .tile{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;color:var(--tile-ink)}
.habit .tile svg{width:24px;height:24px}
.habit .txt{flex:1;min-width:0}
.habit .name{font-weight:600;font-size:15.5px;line-height:1.25}
.habit .sub{font-size:12.5px;color:var(--ink-2)}
.check{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:all .2s}
.check svg{width:18px;height:18px;opacity:0;transform:scale(.6);transition:all .2s}
.habit.done{background:var(--good-bg);border-color:transparent}
.habit.done .name{color:var(--good)}
.habit.done .check{background:var(--moss);border-color:var(--moss);color:var(--on-moss)}
.habit.done .check svg{opacity:1;transform:none}
.habit.weekmet:not(.done) .check{border-color:var(--sage)}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--moss)}

/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .big{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1}
.stat .big small{font-size:14px;font-weight:500;color:var(--ink-2);margin-left:2px}
.stat svg.spark{width:100%;height:34px;margin-top:4px}
.scale{position:relative;height:8px;border-radius:99px;margin-top:8px;background:linear-gradient(90deg,var(--mist) 0 18%,var(--sage) 18% 45%,var(--butter) 45% 72%,var(--blush) 72%)}
.scale b{position:absolute;top:-4px;width:4px;height:16px;border-radius:3px;background:var(--ink);transform:translateX(-50%)}

/* charts */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--ink-3);font-size:10px;font-family:var(--f-body)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:11px 12px;font-size:16px;color:var(--ink);font-weight:500}
.inp:focus{outline:none;border-color:var(--moss)}
.unit{position:relative}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:14px;pointer-events:none}
.unit .inp{padding-right:44px}
.seg{display:inline-flex;background:var(--cream);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.pick[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--on-moss)}
.faces{display:flex;justify-content:space-between;gap:6px}
.face{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);font-weight:600}
.face svg{width:30px;height:30px}
.face[aria-pressed="true"]{background:var(--butter);border-color:var(--butter);color:var(--tile-ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .inp{text-align:center}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar .lbl{font-family:var(--f-display);font-weight:600;font-size:18px;text-align:center}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ic{border:1.5px solid var(--line);background:var(--card);border-radius:12px;aspect-ratio:1;display:grid;place-items:center;color:var(--ink);max-width:100%}
.ic svg{width:22px;height:22px}
.ic[aria-pressed="true"]{background:var(--cream);border-color:var(--ink)}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.list-row .tile{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--tile-ink)}
.list-row .tile svg{width:20px;height:20px}
.list-row .txt{flex:1;min-width:0}

/* heatmap */
.heat{display:grid;gap:4px;align-items:center}
.heat .hn{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat .c{aspect-ratio:1;border-radius:4px;background:var(--cream);max-width:100%}
.heat .c.on{background:var(--moss)}
.heat .c.future{background:transparent;border:1px dashed var(--line)}
.heat .dl{font-size:9.5px;color:var(--ink-3);text-align:center}

/* wins */
.wins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.win{border-radius:18px;padding:12px 8px;text-align:center;background:var(--cream);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-3)}
.win .medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--oat);color:var(--ink-3)}
.win .medal svg{width:22px;height:22px}
.win.got{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.win.got .medal{background:var(--butter);color:var(--tile-ink)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;text-decoration:none;color:var(--ink-3);font-size:11px;font-weight:600;border-radius:14px}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a[aria-current="page"]{color:var(--moss)}
nav.tabs a[aria-current="page"] svg{transform:translateY(-1px)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:9px 12px;font-size:13px;font-weight:600}
.confirm{background:var(--high-bg);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;color:var(--high);font-size:13.5px;font-weight:600}
.empty{text-align:center;padding:18px 10px;color:var(--ink-2)}
details summary{cursor:pointer;font-weight:600;color:var(--ink-2);font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){h1{font-size:24px}.sprout{width:104px;height:104px}.stat .big{font-size:22px}}
</style>

<script>
(function(){

  tea:P('<path d="M5 9h11v4a5.5 5.5 0 0 1-11 0zM16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5c0 1.5 1 1.5 1 3M11.5 3.5c0 1.5 1 1.5 1 3"/>'),
};
const UI = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  left:P('<path d="M15 5l-7 7 7 7"/>'), right:P('<path d="M9 5l7 7-7 7"/>'),

const S={profile:null,config:null,days:{},mode:'local',loaded:false,stale:false};

function loadLocal(){try{const raw=localStorage.getItem(LKEY);if(raw){const j=JSON.parse(raw);S.profile=j.profile||null;S.config=j.config||null;S.days=j.days||{};}}catch(e){} S.loaded=true;}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({profile:S.profile,config:S.config,days:S.days}))}catch(e){}}
function write(docId,body){
  if(S.mode==='db'&&col){
    writeQ[docId]=(writeQ[docId]||Promise.resolve()).then(()=>col.doc(docId).set(body)).catch(e=>{
      if(e&&e.code==='quota_exceeded') toast('Storage is full. Export your data first.');
      else toast('Couldn\'t save. Check your connection.');
    });
  } else saveLocal();
}

async function boot(){
  let db=null,user=null,id=null;
  if(window.claude&&typeof window.claude.use==='function'){
    try{[db,user,downloads]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);}catch(e){}
    try{id=user?await user.id():null}catch(e){}
  }
  if(db&&id){
    S.mode='db';
    try{col=db.collection('data/users/'+id)}catch(e){col=null}
  }
  if(!col){S.mode='local';loadLocal();route();return}
  let timer=setTimeout(()=>{if(!S.loaded){S.stale=true;loadLocal();S.mode='db';route();}},10000);
  col.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);S.stale=false}
    const days={};let profile=null,config=null;
    snap.docs.forEach(doc=>{const v=doc.data();if(!v)return;
      if(doc.id==='profile')profile=v;else if(doc.id==='config')config=v;else if(doc.id[0]==='d')days[doc.id.slice(1)]=JSON.parse(JSON.stringify(v));});
    S.profile=profile?JSON.parse(JSON.stringify(profile)):null;
    S.config=config?JSON.parse(JSON.stringify(config)):null;
    S.days=days;S.loaded=true;
    softRender();
  },err=>{clearTimeout(timer);S.stale=true;if(!S.loaded){S.mode='local';loadLocal();}route();});
}

function series(key){return Object.keys(S.days).sort().map(d=>({d,v:S.days[d][key]})).filter(p=>p.v!=null&&p.v!==''&&!isNaN(p.v)).map(p=>({d:p.d,v:+p.v}))}
function latest(key){const s=series(key);return s.length?s[s.length-1]:null}
function bmi(w,hcm){if(!w||!hcm)return null;const m=hcm/100;return w/(m*m)}
function bmiBand(b){if(b==null)return['n/a',''];if(b<18.5)return['Underweight','warn'];if(b<25)return['Healthy','good'];if(b<30)return['Overweight','warn'];if(b<35)return['Obesity class I','high'];if(b<40)return['Obesity class II','high'];return['Obesity class III','high']}
function whtrBand(r){if(r==null)return['n/a',''];if(r<0.4)return['Below range','warn'];if(r<0.5)return['Healthy','good'];if(r<0.6)return['Increased risk','warn'];return['High risk','high']}
function weekCount(h,dateStr){const m=mondayOf(dateStr);let c=0;for(let i=0;i<7;i++){const d=addDays(m,i);if(S.days[d]?.done?.[h.id])c++}return c}
function dayScore(d){const hs=habits();if(!hs.length)return 0;const day=S.days[d];if(!day)return 0;let need=0,got=0;
  hs.forEach(h=>{if(h.freq==='daily'){need++;if(day.done?.[h.id])got++}else{ if(day.done?.[h.id]){need++;got++} }});return need?got/need:0}
function streak(){let n=0,d=today();if(dayScore(d)<0.5)d=addDays(d,-1);while(dayScore(d)>=0.5&&n<999){n++;d=addDays(d,-1)}return n}
function moveWeek(dateStr){const m=mondayOf(dateStr);return Array.from({length:7},(_,i)=>{const d=addDays(m,i);return{d,v:+(S.days[d]?.move||0)}})}

/* ---------- charts ---------- */
function spark(pts){
  if(pts.length<2)return `<svg class="spark" viewBox="0 0 120 34"><line x1="0" y1="28" x2="120" y2="28" stroke="var(--line)" stroke-dasharray="3 4"/></svg>`;
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),rg=mx-mn||1;
  const xy=pts.map((p,i)=>[4+i*(112/(pts.length-1)),5+(1-(p.v-mn)/rg)*22]);
  const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const last=xy[xy.length-1];
  return `<svg class="spark" viewBox="0 0 120 34"><path d="${d} L${last[0]} 33 L4 33Z" fill="var(--sage)" opacity=".22"/><path d="${d}" fill="none" stroke="var(--moss)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="var(--moss)"/></svg>`;
}
function niceTicks(mn,mx,n=4){const span=mx-mn||1;const raw=span/n;const mag=Math.pow(10,Math.floor(Math.log10(raw)));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||raw;const lo=Math.floor(mn/step)*step,hi=Math.ceil(mx/step)*step;const t=[];for(let v=lo;v<=hi+1e-9;v+=step)t.push(+v.toFixed(6));return t}
function lineChart(dates,vals,{unit='',color='var(--moss)',goal=null}={}){
  const W=340,H=170,L=34,R=10,T=12,B=24,pw=W-L-R,ph=H-T-B,n=dates.length;
  const have=vals.map((v,i)=>v==null?null:{i,v}).filter(Boolean);
  if(!have.length)return `<div class="empty tiny">Nothing logged in this period yet.</div>`;
  let mn=Math.min(...have.map(p=>p.v)),mx=Math.max(...have.map(p=>p.v));
  if(goal!=null){mn=Math.min(mn,goal);mx=Math.max(mx,goal)}
  const padv=Math.max((mx-mn)*0.15,0.5);const ticks=niceTicks(mn-padv,mx+padv);const lo=ticks[0],hi=ticks[ticks.length-1];
  const x=i=>L+(n===1?pw/2:i*(pw/(n-1))),y=v=>T+(1-(v-lo)/(hi-lo))*ph;
  let g='';ticks.forEach(t=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+3.5}" text-anchor="end">${fmt(t)}</text>`});
  const every=n<=8?1:Math.ceil(n/7);let xl='';dates.forEach((d,i)=>{if(i%every===0||i===n-1&&n<=8){const dd=parse(d);xl+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${n<=7?DOW[(dd.getDay()+6)%7]:dd.getDate()}</text>`}});
  if(goal!=null&&goal>=lo&&goal<=hi)g+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--butter)" stroke-width="2" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(goal)-5}" text-anchor="end">goal ${fmt(goal)}</text>`;
  const path=have.map((p,k)=>(k?'L':'M')+x(p.i).toFixed(1)+' '+y(p.v).toFixed(1)).join('');
  const area=have.length>1?`<path d="${path} L${x(have[have.length-1].i)} ${T+ph} L${x(have[0].i)} ${T+ph}Z" fill="${color}" opacity=".14"/>`:'';
  const dots=have.map((p,k)=>`<circle cx="${x(p.i)}" cy="${y(p.v)}" r="${k===have.length-1?4.5:3}" fill="${k===have.length-1?color:'var(--card)'}" stroke="${color}" stroke-width="2"/>`).join('');
  const lp=have[have.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart">${g}${xl}${area}<path d="${path}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}<text x="${Math.min(x(lp.i),W-R-4)}" y="${y(lp.v)-9}" text-anchor="${x(lp.i)>W-50?'end':'middle'}" style="fill:var(--ink);font-weight:700;font-size:11px">${fmt(lp.v)}${unit}</text></svg>`;
}
function barChart(dates,vals,{color='var(--sage)',goal=null,unit=''}={}){
  const W=340,H=160,L=34,R=10,T=12,B=24,pw=W-L-R,ph=H-T-B,n=dates.length;
  const mxv=Math.max(1,...vals.map(v=>v||0),goal||0);const ticks=niceTicks(0,mxv,3);const hi=ticks[ticks.length-1];
  const y=v=>T+(1-v/hi)*ph,slot=pw/n,bw=Math.max(3,Math.min(26,slot*0.62));
  let g='';ticks.forEach(t=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+3.5}" text-anchor="end">${fmt(t,0)}</text>`});
  if(goal)g+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--butter)" stroke-width="2" stroke-dasharray="5 4"/>`;
  let b='',xl='';const every=n<=8?1:Math.ceil(n/7);const td=today();
  dates.forEach((d,i)=>{const v=vals[i]||0,cx=L+slot*i+slot/2;
    if(v>0)b+=`<rect x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${T+ph-y(v)}" rx="${Math.min(6,bw/2)}" fill="${d===td?'var(--moss)':color}"/>`;
    else b+=`<rect x="${cx-bw/2}" y="${T+ph-3}" width="${bw}" height="3" rx="1.5" fill="var(--line)"/>`;
    if(i%every===0){const dd=parse(d);xl+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${n<=7?DOW[i]:dd.getDate()}</text>`}});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${g}${b}${xl}</svg>`;
}
function ringSvg(frac){const r=23,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 56 56"><circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--cream)" stroke-width="7"/><circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--moss)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-frac)}" transform="rotate(-90 28 28)" style="transition:stroke-dashoffset .5s"/></svg>`}

function sproutLine(frac,done,total,name){

function viewToday(){
  const d=today(),p=S.profile,hs=habits(),day=getDay(d);
  const daily=hs.filter(h=>h.freq==='daily'),weekly=hs.filter(h=>h.freq==='weekly');
  const dd=daily.filter(h=>day.done?.[h.id]).length,wd=weekly.filter(h=>day.done?.[h.id]).length;
  const total=daily.length+weekly.filter(h=>weekCount(h,d)<h.target||day.done?.[h.id]).length;
  const done=dd+wd,frac=total?Math.min(1,done/total):0;
  const wl=latest('weight'),wa=latest('waist');
  const curW=wl?wl.v:p.startWeight,curWa=wa?wa.v:p.startWaist;
  const b=bmi(curW,p.heightCm),bb=bmiBand(b),wr=curWa/p.heightCm,wb=whtrBand(wr);
  const dW=curW-p.startWeight,dWa=curWa-p.startWaist;
  const mv=moveWeek(d),mvTot=mv.reduce((a,x)=>a+x.v,0),goal=S.config?.moveGoal||150;
  const st=streak();
  const pos=v=>Math.max(2,Math.min(98,v));
  const bPos=pos(((b-15)/(42-15))*100), wPos=pos(((wr-0.35)/(0.75-0.35))*100);
  const delta=(v,u)=>Math.abs(v)<0.05?`<span class="chip">no change yet</span>`:`<span class="chip ${v<0?'good':''}">${v<0?'down':'up'} ${fmt(Math.abs(v))} ${u}</span>`;
  return `<div class="stack">${banner()}
  <div class="hero"><div style="min-width:0">
    <div class="eyebrow">${nice(d)}</div><h1 style="margin-top:4px">Hi ${esc(p.name)}</h1>
    <p class="bubble"><b>${esc(p.sprout||'Pip')}:</b> ${sproutLine(frac,done,total,p.name)}</p></div>${sproutSvg(frac)}</div>

  <div class="spread" style="margin:4px 2px 0">
    <div class="ringrow">${ringSvg(frac)}<div><div class="eyebrow">Today's goals</div><div style="font-family:var(--f-display);font-size:20px;font-weight:600" class="num">${done} of ${total} done</div></div></div>
    <span class="chip ${st?'good':''}" title="Days in a row with at least half your daily goals">${UI.flame.replace('<svg','<svg width="14" height="14"')} ${st} day streak</span>
  </div>
  <div class="habits">${hs.length?hs.map(h=>habitRow(h,d)).join(''):`<div class="card empty">No goals yet. <a href="#goals">Add your first one</a>.</div>`}</div>

  <div class="section-h"><h2>Your body</h2><a class="tiny" href="#log" style="color:var(--moss);font-weight:600">Log weight or waist</a></div>
  <div class="grid2">
    <div class="stat"><div class="eyebrow">Weight</div><div class="big num">${fmt(curW)}<small>kg</small></div>${delta(dW,'kg')}${spark(series('weight').slice(-8))}</div>
    <div class="stat"><div class="eyebrow">Waist</div><div class="big num">${fmt(curWa)}<small>cm</small></div>${delta(dWa,'cm')}${spark(series('waist').slice(-8))}</div>
    <div class="stat"><div class="eyebrow">BMI</div><div class="big num">${fmt(b)}</div><span class="chip ${bb[1]}">${bb[0]}</span><div class="scale" aria-hidden="true"><b style="left:${bPos}%"></b></div></div>
    <div class="stat"><div class="eyebrow">Waist to height</div><div class="big num">${wr.toFixed(2)}</div><span class="chip ${wb[1]}">${wb[0]}</span><div class="scale" aria-hidden="true"><b style="left:${wPos}%"></b></div></div>
  </div>
  <p class="tiny muted" style="margin:-4px 4px 0">Waist to height under 0.5 is the NICE healthy target: a waist less than half your height. That's ${fmt(p.heightCm/2,0)} cm for you.</p>

  <div class="card stack" style="gap:8px">
    <div class="spread"><div><div class="eyebrow">Movement this week</div><div style="font-family:var(--f-display);font-size:20px;font-weight:600" class="num">${mvTot} <span class="muted" style="font-size:15px;font-weight:500">of ${goal} min</span></div></div>
    ${mvTot>=goal?'<span class="chip good">Goal met</span>':`<span class="chip">${goal-mvTot} min to go</span>`}</div>
    ${barChart(mv.map(x=>x.d),mv.map(x=>x.v),{goal:Math.round(goal/7)})}
    <div class="legend"><span><i style="background:var(--sage)"></i>Minutes moved</span><span><i style="background:var(--butter)"></i>Daily share of goal</span></div>
  </div>
  <a class="btn block" href="#log" style="text-align:center;text-decoration:none">Log today</a>
  </div>`;
}

    <div class="lbl">${isToday?'Today':nice(d)}<div class="tiny muted" style="font-family:var(--f-body);font-weight:500">${isToday?nice(d):'Logging a past day'}</div></div>

    <div><div class="eyebrow" style="margin-bottom:8px">Energy</div><div class="faces" role="group" aria-label="Energy">${[1,2,3,4,5].map(n=>`<button type="button" class="face" data-act="scale" data-k="energy" data-v="${n}" aria-pressed="${day.energy==n}"><span style="font-family:var(--f-display);font-size:20px;line-height:30px">${n}</span>${['Drained','Low','Steady','Good','Buzzing'][n-1]}</button>`).join('')}</div></div>
  </div>
  ${ts.length?`<div class="card stack"><div class="spread"><h2>Your trackers</h2><a class="tiny" href="#goals" style="color:var(--moss);font-weight:600">Add a tracker</a></div>
    ${ts.map(t=>t.kind==='scale'
      ?`<div><div class="eyebrow" style="margin-bottom:8px">${esc(t.name)}</div><div class="faces">${[1,2,3,4,5].map(n=>`<button type="button" class="face" data-act="tscale" data-id="${t.id}" data-v="${n}" aria-pressed="${day.t?.[t.id]==n}"><span style="font-family:var(--f-display);font-size:20px;line-height:30px">${n}</span></button>`).join('')}</div></div>`
      :`<label class="f">${esc(t.name)}<div class="unit"><input class="inp num" data-tracker="${t.id}" id="t_${t.id}" type="number" inputmode="decimal" step="any" min="0" value="${day.t?.[t.id]??''}" placeholder="${t.unit==='litres'?'e.g. 1.5':'0'}"><span>${esc(t.unit||'')}</span></div></label>`).join('')}</div>`:''}
  ${hs.length?`<div class="stack" style="gap:10px"><div class="section-h"><h2>Goals for ${isToday?'today':'this day'}</h2></div><div class="habits">${hs.map(h=>habitRow(h,d)).join('')}</div></div>`:''}
  <div class="card stack"><label class="f">Note<textarea class="inp" id="l_note" rows="3" placeholder="Anything worth remembering? A craving, a win, how the walk felt.">${esc(day.note||'')}</textarea></label></div>

function periodDates(){
  if(V.period==='week'){const m=mondayOf(V.anchor);return Array.from({length:7},(_,i)=>addDays(m,i))}
  const a=parse(V.anchor),y=a.getFullYear(),mo=a.getMonth(),n=new Date(y,mo+1,0).getDate();
  return Array.from({length:n},(_,i)=>iso(new Date(y,mo,i+1)));
}
function periodLabel(ds){if(V.period==='month'){const a=parse(V.anchor);return `${['January','February','March','April','May','June','July','August','September','October','November','December'][a.getMonth()]} ${a.getFullYear()}`}
  const a=parse(ds[0]),b=parse(ds[6]);return `${a.getDate()} ${MON[a.getMonth()]} to ${b.getDate()} ${MON[b.getMonth()]}`}

function viewProgress(){
  const ds=periodDates(),td=today(),hs=habits(),ts=trackers();
  const val=k=>ds.map(d=>{const v=S.days[d]?.[k];return v==null||v===''?null:+v});
  const w=val('weight'),wa=val('waist'),mv=ds.map(d=>+(S.days[d]?.move||0)),mood=val('mood'),en=val('energy');
  const first=a=>a.find(v=>v!=null),last=a=>[...a].reverse().find(v=>v!=null);
  const chg=a=>{const f=first(a),l=last(a);return f!=null&&l!=null&&a.filter(v=>v!=null).length>1?l-f:null};
  // previous reading before period for change
  const before=(k)=>{const s=series(k).filter(p=>p.d<ds[0]);return s.length?s[s.length-1].v:null};
  const wChange=(()=>{const l=last(w),b=before('weight')??first(w);return l!=null&&b!=null&&!(b===l&&w.filter(v=>v!=null).length<2&&before('weight')==null)?l-b:null})();
  const waChange=(()=>{const l=last(wa),b=before('waist')??first(wa);return l!=null&&b!=null&&!(b===l&&wa.filter(v=>v!=null).length<2&&before('waist')==null)?l-b:null})();
  const mvTot=mv.reduce((a,b)=>a+b,0),goal=S.config?.moveGoal||150,weeks=ds.length/7;
  const past=ds.filter(d=>d<=td);
  let need=0,got=0;hs.forEach(h=>{if(h.freq==='daily'){need+=past.length;got+=past.filter(d=>S.days[d]?.done?.[h.id]).length}else{const tgt=Math.round(h.target*past.length/7);need+=tgt;got+=Math.min(tgt,past.filter(d=>S.days[d]?.done?.[h.id]).length)}});
  const pct=need?Math.round(100*got/need):0;
  const avg=a=>{const v=a.filter(x=>x!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
  const sign=v=>v==null?'n/a':(v>0?'+':v<0?'−':'')+fmt(Math.abs(v));
  const cols=ds.length;
  const heat=hs.length?`<div class="heat" style="grid-template-columns:minmax(70px,1.3fr) repeat(${cols},1fr)">
    <span></span>${ds.map((d,i)=>`<span class="dl">${cols<=7?DOW[i][0]:(i%5===0||i===cols-1?parse(d).getDate():'')}</span>`).join('')}
    ${hs.map(h=>`<span class="hn" title="${esc(h.name)}">${esc(h.name)}</span>${ds.map(d=>`<span class="c ${d>td?'future':S.days[d]?.done?.[h.id]?'on':''}" title="${nice(d)}"></span>`).join('')}`).join('')}</div>`:'<div class="empty tiny">Add goals to see them here.</div>';
  const typeCount={};ds.forEach(d=>(S.days[d]?.moveTypes||[]).forEach(t=>typeCount[t]=(typeCount[t]||0)+1));
  return `<div class="stack">${banner()}
  <div class="spread"><h1>Progress</h1><div class="seg" role="group" aria-label="Period"><button data-act="period" data-v="week" aria-pressed="${V.period==='week'}">Week</button><button data-act="period" data-v="month" aria-pressed="${V.period==='month'}">Month</button></div></div>
  <div class="datebar card" style="padding:10px">
    <button class="icon-btn" data-act="shift" data-v="-1" aria-label="Previous ${V.period}">${UI.left}</button>
    <div class="lbl">${periodLabel(ds)}</div>
    <button class="icon-btn" data-act="shift" data-v="1" aria-label="Next ${V.period}" ${ds[ds.length-1]>=td?'disabled style="opacity:.35"':''}>${UI.right}</button>
  </div>
  <div class="grid2">
    <div class="stat"><div class="eyebrow">Weight change</div><div class="big num">${sign(wChange)}<small>kg</small></div></div>
    <div class="stat"><div class="eyebrow">Waist change</div><div class="big num">${sign(waChange)}<small>cm</small></div></div>
    <div class="stat"><div class="eyebrow">Moved</div><div class="big num">${mvTot}<small>min</small></div><span class="tiny muted">goal ${Math.round(goal*weeks)} min</span></div>
    <div class="stat"><div class="eyebrow">Goals hit</div><div class="big num">${pct}<small>%</small></div><span class="tiny muted">${got} of ${need} so far</span></div>
  </div>
  <div class="card stack" style="gap:6px"><div class="spread"><h2>Weight</h2><span class="tiny muted">kg</span></div>${lineChart(ds,w,{unit:'',goal:S.config?.goalWeight||null})}</div>
  <div class="card stack" style="gap:6px"><div class="spread"><h2>Waist</h2><span class="tiny muted">cm</span></div>${lineChart(ds,wa,{color:'var(--ink-2)',goal:S.config?.goalWaist||null})}</div>
  <div class="card stack" style="gap:6px"><div class="spread"><h2>Movement</h2><span class="tiny muted">minutes per day</span></div>${barChart(ds,mv,{goal:Math.round(goal/7)})}
    ${Object.keys(typeCount).length?`<div class="chips">${Object.entries(typeCount).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`<span class="chip">${esc(t)} × ${c}</span>`).join('')}</div>`:''}</div>
  <div class="card stack" style="gap:10px"><div class="spread"><h2>Goals</h2><span class="tiny muted">filled = done</span></div><div style="overflow-x:auto">${heat}</div></div>
  <div class="card stack" style="gap:6px"><div class="spread"><h2>Mood and energy</h2><span class="tiny muted">avg ${fmt(avg(mood))} / ${fmt(avg(en))}</span></div>${lineChart(ds,mood,{color:'var(--lavender)'})}
    ${en.some(v=>v!=null)?lineChart(ds,en,{color:'var(--butter)'}):''}
    <div class="legend"><span><i style="background:var(--lavender)"></i>Mood</span><span><i style="background:var(--butter)"></i>Energy</span></div></div>
  ${ts.map(t=>{const a=ds.map(d=>{const v=S.days[d]?.t?.[t.id];return v==null||v===''?null:+v});
    return `<div class="card stack" style="gap:6px"><div class="spread"><h2>${esc(t.name)}</h2><span class="tiny muted">avg ${fmt(avg(a))} ${esc(t.unit||'')}</span></div>${t.kind==='scale'?lineChart(ds,a,{color:'var(--mist)'}):barChart(ds,a.map(v=>v||0),{color:'var(--mist)',goal:t.goal||null})}</div>`}).join('')}
  </div>`;
}

function viewGoals(){
  const hs=habits(),ts=trackers(),c=S.config||{};
  const nh=V.newHabit,nt=V.newTracker;
  const habitForm=(h,isNew)=>`<form class="stack" id="habitForm" data-id="${h.id||''}" style="gap:12px;padding-top:6px">
    <label class="f">Goal<input class="inp" id="h_name" value="${esc(h.name||'')}" placeholder="e.g. 10 minute stretch before bed" required maxlength="48"></label>

      <div class="seg"><button type="button" data-act="hfreq" data-v="daily" aria-pressed="${h.freq!=='weekly'}">Every day</button><button type="button" data-act="hfreq" data-v="weekly" aria-pressed="${h.freq==='weekly'}">Times a week</button></div>
      ${h.freq==='weekly'?`<div class="unit" style="width:110px"><input class="inp num" id="h_target" type="number" min="1" max="7" value="${h.target||3}" aria-label="Times per week"><span>/wk</span></div>`:''}</div></div>
    <div class="stack" style="gap:6px"><span class="eyebrow">Icon</span><div class="icons">${Object.keys(ICONS).map(k=>`<button type="button" class="ic" data-act="hicon" data-v="${k}" aria-pressed="${h.icon===k}" aria-label="${k}">${ICONS[k]}</button>`).join('')}</div></div>
    <div class="stack" style="gap:6px"><span class="eyebrow">Colour</span><div class="swatches">${Object.keys(COLORS).map(k=>`<button type="button" class="sw" data-act="hcolor" data-v="${k}" aria-pressed="${h.color===k}" style="background:${COLORS[k]}" aria-label="${k}"></button>`).join('')}</div></div>

  return `<div class="stack">${banner()}
  <h1>Goals</h1>
  <p class="muted">Start small, then level up. When a goal feels easy for two weeks, make it a little bigger or add a new one.</p>
  <div class="card">
    <div class="spread" style="margin-bottom:6px"><h2>Daily and weekly goals</h2>${nh?'':`<button class="btn sm soft" data-act="hnew">${UI.plus.replace('<svg','<svg width="16" height="16" style="vertical-align:-3px"')} Add</button>`}</div>
    ${nh&&!nh.id?habitForm(nh,true):''}
    <div>${hs.map(h=>V.newHabit&&V.newHabit.id===h.id?habitForm(V.newHabit,false):`<div class="list-row"><span class="tile" style="background:${COLORS[h.color]||COLORS.sage}">${ICONS[h.icon]||ICONS.leaf}</span><div class="txt"><div style="font-weight:600">${esc(h.name)}</div><div class="tiny muted">${h.freq==='daily'?'Every day':h.target+' times a week'}</div></div>
      <button class="icon-btn" data-act="hedit" data-id="${h.id}" aria-label="Edit ${esc(h.name)}">${UI.edit}</button><button class="icon-btn" data-act="hdel" data-id="${h.id}" aria-label="Remove ${esc(h.name)}">${UI.trash}</button></div>
      ${V.confirm===('h'+h.id)?`<div class="confirm">Remove this goal? Past ticks stay in your history.<span class="row"><button class="btn sm danger" data-act="hdelok" data-id="${h.id}">Remove</button><button class="btn sm ghost" data-act="nocf">Keep</button></span></div>`:''}`).join('')||(!nh?'<div class="empty tiny">No goals yet.</div>':'')}</div>
  </div>

  <div class="card">
    <div class="spread" style="margin-bottom:6px"><h2>Extra trackers</h2>${nt?'':`<button class="btn sm soft" data-act="tnew">${UI.plus.replace('<svg','<svg width="16" height="16" style="vertical-align:-3px"')} Add</button>`}</div>
    <p class="tiny muted" style="margin-bottom:6px">Weight, waist, movement, mood and energy are always on the Log page. Add anything else you want to watch: steps, sleep, cravings, hip measurement.</p>

      <div class="stack" style="gap:6px"><span class="eyebrow">Type</span><div class="seg"><button type="button" data-act="tkind" data-v="number" aria-pressed="${nt.kind!=='scale'}">Number</button><button type="button" data-act="tkind" data-v="scale" aria-pressed="${nt.kind==='scale'}">1 to 5 rating</button></div></div>

      <div class="row"><button class="btn" type="submit" style="flex:1">${nt.id?'Save tracker':'Add tracker'}</button><button class="btn ghost" type="button" data-act="tcancel">Cancel</button></div></form>`:''}
    <div>${ts.map(t=>`<div class="list-row"><span class="tile" style="background:var(--mist)">${ICONS[t.icon]||ICONS.sparkle}</span><div class="txt"><div style="font-weight:600">${esc(t.name)}</div><div class="tiny muted">${t.kind==='scale'?'1 to 5 rating':esc(t.unit||'number')}${t.goal?` · goal ${fmt(t.goal)}`:''}</div></div>
      <button class="icon-btn" data-act="tedit" data-id="${t.id}" aria-label="Edit ${esc(t.name)}">${UI.edit}</button><button class="icon-btn" data-act="tdel" data-id="${t.id}" aria-label="Remove ${esc(t.name)}">${UI.trash}</button></div>
      ${V.confirm===('t'+t.id)?`<div class="confirm">Remove this tracker? Past entries stay saved.<span class="row"><button class="btn sm danger" data-act="tdelok" data-id="${t.id}">Remove</button><button class="btn sm ghost" data-act="nocf">Keep</button></span></div>`:''}`).join('')||(!nt?'<div class="empty tiny">No extra trackers.</div>':'')}</div>
  </div>

  <form class="card stack" id="targetForm" autocomplete="off">
    <h2>Targets</h2>
    <label class="f">Movement per week<div class="unit"><input class="inp num" id="g_move" type="number" min="10" max="2000" step="5" value="${c.moveGoal||150}"><span>min</span></div><span class="tiny muted" style="font-weight:500">The NHS suggests 150 minutes of moderate activity a week. Build up to it.</span></label>
    <div class="grid2">
      <label class="f">Goal weight (optional)<div class="unit"><input class="inp num" id="g_w" type="number" step="0.1" min="30" max="300" value="${c.goalWeight??''}"><span>kg</span></div></label>
      <label class="f">Goal waist (optional)<div class="unit"><input class="inp num" id="g_wa" type="number" step="0.5" min="40" max="200" value="${c.goalWaist??''}"><span>cm</span></div></label>
    </div>
    <button class="btn" type="submit">Save targets</button>
  </form></div>`;
}

function wins(){
  const p=S.profile,ws=series('weight'),was=series('waist'),lw=ws.length?ws[ws.length-1].v:p.startWeight,lwa=was.length?was[was.length-1].v:p.startWaist;
  const logged=Object.keys(S.days).length,st=streak();
  let best=0,run=0;Object.keys(S.days).sort().forEach((d,i,a)=>{if(dayScore(d)>=0.5){run=(i&&addDays(a[i-1],1)===d&&dayScore(a[i-1])>=0.5)?run+1:1;best=Math.max(best,run)}});
  const walks=Object.values(S.days).filter(d=>d.done?.walk||(d.moveTypes||[]).includes('Walk')).length;
  const strength=Object.values(S.days).filter(d=>d.done?.strength||(d.moveTypes||[]).includes('Strength')).length;
  let bigWeek=false;const mons=new Set(Object.keys(S.days).map(mondayOf));mons.forEach(m=>{if(moveWeek(m).reduce((a,x)=>a+x.v,0)>=(S.config?.moveGoal||150))bigWeek=true});
  const lost=p.startWeight-lw,cm=p.startWaist-lwa;
  return [
    ['First day logged',logged>=1,UI.star],['3 days in a row',best>=3,UI.flame],['7 days in a row',best>=7,UI.flame],
    ['10 walks',walks>=10,ICONS.walk],['10 strength sessions',strength>=10,ICONS.dumbbell],['Full movement week',bigWeek,ICONS.sun],
    ['First kg down',lost>=1,ICONS.leaf],['5 kg down',lost>=5,ICONS.sparkle],['5% of body weight',lost>=p.startWeight*0.05,ICONS.heart],
    ['Waist down 2 cm',cm>=2,ICONS.plate],['Waist down 5 cm',cm>=5,ICONS.sparkle],['Waist under half height',lwa/p.heightCm<0.5,UI.star],
  ];
}

function viewMe(){
  const p=S.profile,wl=latest('weight'),wa=latest('waist');
  const cw=wl?wl.v:p.startWeight,cwa=wa?wa.v:p.startWaist;
  const b=bmi(cw,p.heightCm),r=cwa/p.heightCm;
  const ft=Math.floor(p.heightCm/2.54/12),inch=Math.round(p.heightCm/2.54-ft*12);
  const W=wins(),got=W.filter(w=>w[1]).length;
  return `<div class="stack">${banner()}
  <div class="hero"><div style="min-width:0"><div class="eyebrow">Started ${nice(p.startDate||today())}</div><h1 style="margin-top:4px">${esc(p.name)}</h1>
    <p class="bubble">${esc(p.age)} years · ${ft} ft ${inch} in (${fmt(p.heightCm)} cm)<br>Started at ${fmt(p.startWeight)} kg and ${fmt(p.startWaist)} cm waist</p></div>${sproutSvg(Math.min(1,got/W.length+0.2))}</div>
  <div class="row"><button class="btn soft" style="flex:1" data-act="editprofile">Edit details</button>${downloads?'<button class="btn soft" style="flex:1" data-act="export">Export CSV</button>':''}</div>

  <div class="section-h"><h2>Wins</h2><span class="tiny muted num">${got} of ${W.length}</span></div>
  <div class="wins">${W.map(([n,ok,ic])=>`<div class="win ${ok?'got':''}"><span class="medal">${ic}</span>${esc(n)}</div>`).join('')}</div>

  <div class="card stack">
    <h2>Your health markers</h2>
    <div class="stack" style="gap:6px"><div class="spread"><h3>Waist to height ratio</h3><span class="chip ${whtrBand(r)[1]} num">${r.toFixed(2)} · ${whtrBand(r)[0]}</span></div>
      <p class="muted tiny">Waist divided by height. NICE recommends it alongside BMI because it reflects fat around the middle, which is more closely linked to heart disease and type 2 diabetes. Under 0.5 is healthy, 0.5 to 0.59 is increased risk, 0.6 and above is high risk.</p>
      <p class="tiny"><b>Your healthy waist:</b> under ${fmt(p.heightCm/2,0)} cm.</p></div>
    <div class="stack" style="gap:6px;border-top:1px solid var(--line);padding-top:12px"><div class="spread"><h3>BMI</h3><span class="chip ${bmiBand(b)[1]} num">${fmt(b)} · ${bmiBand(b)[0]}</span></div>
      <p class="muted tiny">Weight in kg divided by height in metres squared. 18.5 to 24.9 is the healthy range. It can't tell muscle from fat, so as you build strength, trust your waist more.</p>
      <p class="tiny"><b>Healthy BMI range for your height:</b> ${fmt(18.5*(p.heightCm/100)**2)} to ${fmt(24.9*(p.heightCm/100)**2)} kg.</p></div>
    <p class="tiny muted" style="border-top:1px solid var(--line);padding-top:12px">These are screening numbers, not a diagnosis. Your GP can give you a fuller picture.</p>
  </div>
  <div class="card stack" style="gap:8px"><h2>Palette</h2><p class="tiny muted">Your three colours, plus six that sit with them.</p>
    <div class="swatches">${['--ink','--sage','--cream','--moss','--butter','--blush','--lavender','--mist','--peach'].map(t=>`<span class="sw" style="background:var(${t});border-color:var(--line);border-width:1px"></span>`).join('')}</div></div>
  </div>`;
}

/* ---------- router ---------- */
const ROUTES={today:viewToday,log:viewLog,progress:viewProgress,goals:viewGoals,me:viewMe};
let logDirty=false;
function route(){
  if(!S.loaded){return}
  const tabs=document.getElementById('tabs');
  if(!S.profile||V.edit==='profile'){tabs.hidden=!S.profile;app.innerHTML=viewSetup();return}
  let r=(location.hash||'#today').slice(1);if(!ROUTES[r])r='today';
  tabs.hidden=false;tabs.querySelectorAll('a').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===r?'page':'false'));
  app.innerHTML=ROUTES[r]();
}
function softRender(){
  const r=(location.hash||'#today').slice(1);
  const ae=document.activeElement;
  if((r==='log'&&logDirty)||(ae&&/INPUT|TEXTAREA/.test(ae.tagName)&&app.contains(ae)))return;
  if(V.newHabit||V.newTracker)return;
  route();
}
window.addEventListener('hashchange',()=>{logDirty=false;V.newHabit=null;V.newTracker=null;V.confirm=null;route();window.scrollTo(0,0)});

/* ---------- actions ---------- */
function toggleTick(id,d){
  const day=JSON.parse(JSON.stringify(getDay(d)));day.done=day.done||{};
  if(day.done[id])delete day.done[id];else day.done[id]=true;
  putDay(d,day);
  // keep any unsaved log inputs: only re-render the habit list area when on log
  const r=(location.hash||'#today').slice(1);
  if(r==='log'&&logDirty){document.querySelectorAll(`.habit[data-id="${id}"][data-date="${d}"]`).forEach(b=>{b.outerHTML=habitRow(habits().find(h=>h.id===id),d)});}
  else route();
  if(day.done[id]&&navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
}
function readLogDraft(){return logDraft||(logDraft=JSON.parse(JSON.stringify(getDay(V.logDate))))}
let logDraft=null;

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='tick'){e.preventDefault();toggleTick(b.dataset.id,b.dataset.date);return}
  if(a==='go'){V.edit=null;tempSetup=null;location.hash=v;route();return}
  if(a==='hunit'){captureSetup();V.setupUnit=v;app.innerHTML=viewSetup();return}
  if(a==='logday'){const nd=addDays(V.logDate,+v);if(nd>today())return;V.logDate=nd;logDraft=null;logDirty=false;route();return}
  if(a==='mv'){const i=document.getElementById('l_move');i.value=Math.max(0,(+i.value||0)+(+v));logDirty=true;return}
  if(a==='mtype'){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);logDirty=true;return}
  if(a==='scale'||a==='tscale'){const grp=b.parentElement;const on=b.getAttribute('aria-pressed')!=='true';grp.querySelectorAll('[data-act]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed',on);logDirty=true;return}
  if(a==='period'){V.period=v;V.anchor=today();route();return}
  if(a==='shift'){const ds=periodDates();if(V.period==='week')V.anchor=addDays(ds[0],7*+v);else{const d=parse(V.anchor);V.anchor=iso(new Date(d.getFullYear(),d.getMonth()+(+v),1))}if(V.anchor>today())V.anchor=today();route();return}
  if(a==='hnew'){V.newHabit={name:'',icon:'leaf',color:'sage',freq:'daily',target:3};V.newTracker=null;route();setTimeout(()=>document.getElementById('h_name')?.focus(),30);return}
  if(a==='hedit'){V.newHabit=JSON.parse(JSON.stringify(habits().find(h=>h.id===b.dataset.id)));route();return}
  if(a==='hcancel'){V.newHabit=null;route();return}
  if(a==='hfreq'){captureHabit();V.newHabit.freq=v;route();return}
  if(a==='hicon'){captureHabit();V.newHabit.icon=v;route();return}
  if(a==='hcolor'){captureHabit();V.newHabit.color=v;route();return}
  if(a==='hdel'){V.confirm='h'+b.dataset.id;route();return}
  if(a==='hdelok'){const h=S.config.habits.find(x=>x.id===b.dataset.id);if(h)h.archived=true;V.confirm=null;saveConfig();route();toast('Goal removed');return}
  if(a==='nocf'){V.confirm=null;route();return}
  if(a==='tnew'){V.newTracker={name:'',unit:'',kind:'number'};V.newHabit=null;route();setTimeout(()=>document.getElementById('t_name')?.focus(),30);return}
  if(a==='tedit'){V.newTracker=JSON.parse(JSON.stringify(trackers().find(t=>t.id===b.dataset.id)));route();return}
  if(a==='tcancel'){V.newTracker=null;route();return}
  if(a==='tkind'){captureTracker();V.newTracker.kind=v;route();return}
  if(a==='tdel'){V.confirm='t'+b.dataset.id;route();return}
  if(a==='tdelok'){const t=S.config.trackers.find(x=>x.id===b.dataset.id);if(t)t.archived=true;V.confirm=null;saveConfig();route();toast('Tracker removed');return}
  if(a==='editprofile'){V.edit='profile';V.setupUnit='ft';route();window.scrollTo(0,0);return}
  if(a==='export'){exportCsv();return}
});
document.addEventListener('input',e=>{if(e.target.closest('#logForm'))logDirty=true});

function captureSetup(){const g=id=>document.getElementById(id);if(!g('s_name'))return;
  const p=S.profile?{...S.profile}:{};p.name=g('s_name').value;p.age=+g('s_age').value;p.startWeight=+g('s_w').value;p.startWaist=+g('s_waist').value;p.sprout=g('s_sprout').value;
  if(g('s_cm'))p.heightCm=+g('s_cm').value;else if(g('s_ft'))p.heightCm=r1(((+g('s_ft').value)*12+(+g('s_in').value||0))*2.54);
  tempSetup=p;}
function captureHabit(){const n=document.getElementById('h_name');if(n)V.newHabit.name=n.value;const t=document.getElementById('h_target');if(t)V.newHabit.target=+t.value||3}
function captureTracker(){const g=id=>document.getElementById(id);if(g('t_name'))V.newTracker.name=g('t_name').value;if(g('t_unit'))V.newTracker.unit=g('t_unit').value;if(g('t_goal'))V.newTracker.goal=g('t_goal').value===''?null:+g('t_goal').value}

document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,g=id=>document.getElementById(id);
  if(f.id==='setupForm'){
    captureSetup();const p=tempSetup;
    if(!p.name||!(p.heightCm>100)||!(p.startWeight>30)||!(p.startWaist>40)){toast('Check your height, weight and waist');return}
    const first=!S.profile;
    if(first){p.startDate=today();
      S.config={moveGoal:150,habits:DEFAULT_HABITS.map(h=>({id:h.id,name:h.name,icon:h.icon,color:h.color,freq:h.freq,target:h.target,archived:!g('dh_'+h.id)?.checked})),trackers:DEFAULT_TRACKERS.map(t=>({...t}))};
      saveConfig();
      const day=JSON.parse(JSON.stringify(getDay(today())));day.weight=p.startWeight;day.waist=p.startWaist;putDay(today(),day);}
    S.profile=p;tempSetup=null;saveProfile();V.edit=null;
    if(first){location.hash='today'}
    route();toast(first?'Your sprout is planted':'Details saved');return;
  }
  if(f.id==='logForm'){
    const day=JSON.parse(JSON.stringify(getDay(V.logDate)));
    const num=id=>{const x=g(id).value;return x===''?null:+x};
    day.weight=num('l_weight');day.waist=num('l_waist');day.move=num('l_move');
    day.moveTypes=[...f.querySelectorAll('[data-act="mtype"][aria-pressed="true"]')].map(x=>x.dataset.v);
    const sc=k=>{const x=f.querySelector(`[data-act="scale"][data-k="${k}"][aria-pressed="true"]`);return x?+x.dataset.v:null};
    day.mood=sc('mood');day.energy=sc('energy');day.t=day.t||{};
    f.querySelectorAll('[data-tracker]').forEach(i=>{if(i.value==='')delete day.t[i.dataset.tracker];else day.t[i.dataset.tracker]=+i.value});
    trackers().filter(t=>t.kind==='scale').forEach(t=>{const x=f.querySelector(`[data-act="tscale"][data-id="${t.id}"][aria-pressed="true"]`);if(x)day.t[t.id]=+x.dataset.v;else delete day.t[t.id]});
    day.note=g('l_note').value.trim();
    Object.keys(day).forEach(k=>{if(day[k]===null)delete day[k]});
    putDay(V.logDate,day);logDirty=false;toast('Saved');
    if(V.logDate===today()){location.hash='today'}else route();return;
  }
  if(f.id==='habitForm'){
    captureHabit();const h=V.newHabit;if(!h.name.trim()){toast('Give your goal a name');return}
    h.name=h.name.trim();h.target=h.freq==='weekly'?Math.min(7,Math.max(1,h.target||3)):7;
    if(h.id){const i=S.config.habits.findIndex(x=>x.id===h.id);S.config.habits[i]={...S.config.habits[i],...h}}
    else S.config.habits.push({...h,id:uid(),archived:false});
    V.newHabit=null;saveConfig();route();toast('Goal saved');return;
  }
  if(f.id==='trackerForm'){
    captureTracker();const t=V.newTracker;if(!t.name.trim()){toast('Give your tracker a name');return}
    t.name=t.name.trim();if(t.kind==='scale'){t.unit='';t.goal=null}
    if(t.id){const i=S.config.trackers.findIndex(x=>x.id===t.id);S.config.trackers[i]={...S.config.trackers[i],...t}}
    else S.config.trackers.push({...t,id:uid(),icon:'sparkle',archived:false});
    V.newTracker=null;saveConfig();route();toast('Tracker saved');return;
  }
  if(f.id==='targetForm'){
    const n=id=>{const x=g(id).value;return x===''?null:+x};
    S.config.moveGoal=n('g_move')||150;S.config.goalWeight=n('g_w');S.config.goalWaist=n('g_wa');saveConfig();route();toast('Targets saved');return;
  }
});

async function exportCsv(){
  if(!downloads)return;
  const hs=S.config.habits,ts=S.config.trackers;
  const head=['date','weight_kg','waist_cm','movement_min','movement_types','mood','energy',...ts.map(t=>t.name),...hs.map(h=>h.name),'note'];
  const q=s=>{s=String(s??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=Object.keys(S.days).sort().map(d=>{const x=S.days[d];return[d,x.weight,x.waist,x.move,(x.moveTypes||[]).join('; '),x.mood,x.energy,...ts.map(t=>x.t?.[t.id]),...hs.map(h=>x.done?.[h.id]?1:0),x.note].map(q).join(',')});
  try{await downloads.save({filename:`sprout-tracker-${today()}.csv`,data:[head.map(q).join(','),...rows].join('\n')})}
  catch(e){if(e&&e.code!=='declined')toast('Export isn\'t available here')}
}

boot();
})();
</script>
